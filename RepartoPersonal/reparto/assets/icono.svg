<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradado de fondo squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Brillo superior sutil -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Sombra suave para la cruz -->
    <filter id="crossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.45"/>
    </filter>

    <!-- Degradado brazo vertical -->
    <linearGradient id="vertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>

    <!-- Degradado brazo horizontal -->
    <linearGradient id="horizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Gradiente de acento del núcleo -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Contenedor Squircle con esquinas suaves -->
  <rect x="20" y="20" width="472" height="472" rx="118" ry="118" fill="url(#bgGrad)"/>
  
  <!-- Brillo superior -->
  <rect x="20" y="20" width="472" height="236" rx="118" ry="118" fill="url(#topGloss)"/>

  <!-- Borde interior sutil y elegante -->
  <rect x="22" y="22" width="468" height="468" rx="116" ry="116" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.32"/>

  <!-- 2. Cruz Clínica Modular con Sombra -->
  <g filter="url(#crossShadow)">
    <!-- Brazo Vertical -->
    <rect x="212" y="106" width="88" height="300" rx="44" ry="44" fill="url(#vertGrad)"/>
    
    <!-- Brazo Horizontal -->
    <rect x="106" y="212" width="300" height="88" rx="44" ry="44" fill="url(#horizGrad)"/>
    
    <!-- Centro de Intersección suave -->
    <rect x="212" y="212" width="88" height="88" rx="22" ry="22" fill="#FFFFFF"/>
  </g>

  <!-- 3. Elementos de Rotación y Flujo de Turnos (4 cuadrantes) -->
  <!-- Cuadrante 1: Superior Derecho (Mañanas) -->
  <circle cx="326" cy="186" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M 314 162 A 40 40 0 0 1 350 198" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Cuadrante 2: Inferior Derecho (Tardes) -->
  <circle cx="326" cy="326" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M 350 314 A 40 40 0 0 1 314 350" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Cuadrante 3: Inferior Izquierdo (Refuerzos / Rotación) -->
  <circle cx="186" cy="326" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M 198 350 A 40 40 0 0 1 162 314" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Cuadrante 4: Superior Izquierdo (Planificación) -->
  <circle cx="186" cy="186" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M 162 198 A 40 40 0 0 1 198 162" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- 4. Núcleo Diagnóstico Central -->
  <circle cx="256" cy="256" r="26" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="10" fill="#0EA5E9"/>
  <circle cx="256" cy="256" r="4" fill="#FFFFFF"/>
</svg>